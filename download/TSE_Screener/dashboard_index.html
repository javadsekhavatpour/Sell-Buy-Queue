<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>داشبورد چندنمادی — TSE Early Warning</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-hover: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --green: #22c55e;
    --red: #ef4444;
    --amber: #f59e0b;
    --blue: #3b82f6;
    --purple: #a855f7;
    --gold: #eab308;
    --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Vazirmatn", "Segoe UI", Tahoma, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    color: var(--text);
    min-height: 100vh;
    padding: clamp(1rem, 3vw, 2.5rem);
  }
  header {
    text-align: center;
    margin-bottom: clamp(1.5rem, 4vw, 3rem);
  }
  header h1 {
    font-size: clamp(1.5rem, 5vw, 2.5rem);
    background: linear-gradient(90deg, #60a5fa, #a855f7);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.5rem;
  }
  header .clock {
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  header .clock .live-dot {
    display: inline-block;
    width: 10px; height: 10px;
    background: var(--green);
    border-radius: 50%;
    margin-left: 8px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
    gap: clamp(1rem, 2.5vw, 1.75rem);
    max-width: 1200px;
    margin: 0 auto;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: clamp(1.2rem, 3vw, 1.75rem);
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--accent, var(--blue));
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    border-color: var(--accent, var(--blue));
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.5rem;
  }
  .card-name {
    font-size: clamp(1.8rem, 6vw, 2.4rem);
    font-weight: 700;
    line-height: 1.1;
  }
  .card-fullname {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 0.25rem;
    line-height: 1.4;
  }
  .market-badge {
    font-size: 0.75rem;
    padding: 0.3rem 0.7rem;
    border-radius: 999px;
    background: var(--accent-bg, rgba(59,130,246,0.15));
    color: var(--accent, var(--blue));
    border: 1px solid var(--accent, var(--blue));
    white-space: nowrap;
    font-weight: 600;
  }
  .session-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  .session-badge {
    font-size: 0.8rem;
    padding: 0.25rem 0.7rem;
    border-radius: 999px;
    font-weight: 600;
  }
  .session-badge.open {
    background: rgba(34,197,94,0.15);
    color: var(--green);
    border: 1px solid var(--green);
  }
  .session-badge.closed {
    background: rgba(148,163,184,0.15);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .hours {
    font-size: 0.85rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
  }
  .stat {
    background: rgba(15,23,42,0.5);
    border-radius: 10px;
    padding: 0.6rem 0.8rem;
  }
  .stat-label {
    font-size: 0.7rem;
    color: var(--muted);
    margin-bottom: 0.2rem;
  }
  .stat-value {
    font-size: 1.1rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .card-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 0.75rem;
    border-top: 1px solid var(--border);
  }
  .dash-status {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .dash-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--red);
  }
  .dash-dot.online { background: var(--green); }
  .open-btn {
    font-size: 0.85rem;
    color: var(--accent, var(--blue));
    font-weight: 600;
  }
  .card.disabled {
    cursor: not-allowed;
    opacity: 0.85;
  }
  .card.disabled:hover {
    transform: none;
  }
  footer {
    text-align: center;
    margin-top: 2rem;
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<header>
  <h1>داشبورد چندنمادی — TSE Early Warning</h1>
  <div class="clock">
    <span id="clock">--:--:--</span> تهران
    <span class="live-dot"></span>
  </div>
</header>

<div class="grid" id="grid">
  <p style="color:var(--muted);grid-column:1/-1;text-align:center">در حال بارگذاری…</p>
</div>

<footer>
  برای اجرای داشبورد هر نماد: <code>python run_dashboards.py</code> — سپس روی کارت کلیک کنید.
</footer>

<script>
const MARKET_COLORS = {
  "stock":               ["#3b82f6", "rgba(59,130,246,0.15)"],
  "equity_etf":          ["#a855f7", "rgba(168,85,247,0.15)"],
  "gold_commodity_fund": ["#eab308", "rgba(234,179,8,0.15)"],
  "fixed_income_fund":   ["#22c55e", "rgba(34,197,94,0.15)"],
  "rights":              ["#06b6d4", "rgba(6,182,212,0.15)"],
  "base_market":         ["#f97316", "rgba(249,115,22,0.15)"],
  "unknown":             ["#64748b", "rgba(100,116,139,0.15)"],
};

function fmtPrice(p) {
  if (p === null || p === undefined) return "—";
  return Number(p).toLocaleString("fa-IR");
}

function buildCard(s) {
  const [accent, accentBg] = MARKET_COLORS[s.market_type] || MARKET_COLORS["unknown"];
  const open = s.in_session;
  const online = s.dashboard_online;
  const card = document.createElement("a");
  card.className = "card" + (online ? "" : " disabled");
  card.style.setProperty("--accent", accent);
  card.style.setProperty("--accent-bg", accentBg);
  if (online) {
    card.href = s.dashboard_url;
    card.target = "_blank";
    card.rel = "noopener";
  }
  card.innerHTML = `
    <div class="card-head">
      <div>
        <div class="card-name">${s.name}</div>
        <div class="card-fullname">${s.full_name || ""}</div>
      </div>
      <span class="market-badge">${s.market_label}</span>
    </div>
    <div class="session-row">
      <span class="session-badge ${open ? "open" : "closed"}">${open ? "در جلسه" : "بسته"}</span>
      <span class="hours">معاملات: ${s.trading_hours}</span>
    </div>
    <div class="session-row">
      <span class="hours">${s.session_status}</span>
    </div>
    <div class="stats">
      <div class="stat">
        <div class="stat-label">آخرین قیمت</div>
        <div class="stat-value">${fmtPrice(s.last_price)}</div>
      </div>
      <div class="stat">
        <div class="stat-label">تعداد نمونه</div>
        <div class="stat-value">${fmtPrice(s.snapshot_count)}</div>
      </div>
    </div>
    <div class="card-foot">
      <span class="dash-status">
        <span class="dash-dot ${online ? "online" : ""}"></span>
        ${online ? "داشبورد آنلاین" : "داشبورد آفلاین"}
      </span>
      <span class="open-btn">${online ? "باز کردن ←" : "—"}</span>
    </div>
  `;
  return card;
}

async function refresh() {
  try {
    const r = await fetch("/api/status");
    const d = await r.json();
    document.getElementById("clock").textContent = d.now;
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    for (const s of d.symbols) {
      // market_type را از symbols.json نمی‌آورد؛ از نام برچسب تشخیص می‌دهیم
      grid.appendChild(buildCard(s));
    }
  } catch (e) {
    console.error(e);
  }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
