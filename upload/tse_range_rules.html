<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ویرایش قوانین دامنه نوسان</title>
<style>
  /* استایل‌های پایه */
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 32px 16px;
    color: #111827;
  }
  .container {
    max-width: 960px;
    margin: 0 auto;
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 8px 28px rgba(0,0,0,.08);
    padding: 32px;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 8px;
    color: #111827;
  }
  .sub {
    color: #6b7280;
    font-size: 13px;
    margin-bottom: 24px;
  }

  /* استایل جدول */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th, td {
    padding: 14px 16px;
    border-bottom: 1px solid #f1f5f9;
    text-align: right;
  }
  th {
    background: #f8fafc;
    color: #64748b;
    font-weight: 700;
    font-size: 13px;
  }
  tr:hover td {
    background: #fafbfc;
  }
  .desc {
    color: #6b7280;
    font-size: 13px;
  }

  /* استایل دکمه‌های درصد (شبیه به تصویر) */
  .pct-wrapper {
    display: inline-flex;
    align-items: center;
    background: #4f46e5;
    border-radius: 20px;
    padding: 2px 10px;
    color: #fff;
    font-weight: bold;
    direction: ltr;
  }
  .pct-wrapper span {
    font-size: 14px;
    user-select: none;
  }
  .pct-input {
    width: 44px;
    background: transparent;
    border: none;
    color: #fff;
    font-weight: bold;
    font-family: inherit;
    font-size: 14px;
    text-align: center;
    padding: 2px 0;
    margin: 0 4px;
  }
  .pct-input:focus {
    outline: none;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 6px;
  }
  
  /* قابلیت نمایش فلش‌های بالا/پایین */
  .pct-input::-webkit-inner-spin-button, 
  .pct-input::-webkit-outer-spin-button { 
    opacity: 1;
    filter: invert(1);
    cursor: pointer;
    height: 20px;
  }

  /* دکمه‌های پایین صفحه */
  .actions {
    margin-top: 24px;
    display: flex;
    justify-content: flex-end;
    gap: 12px;
  }
  .btn {
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: bold;
    transition: all 0.2s;
    border: 1px solid transparent;
  }
  .btn-reset {
    background: #f1f5f9;
    color: #ef4444;
    border-color: #e2e8f0;
  }
  .btn-reset:hover {
    background: #fee2e2;
    border-color: #fecaca;
  }
  .btn-json {
    background: #eef2ff;
    color: #4f46e5;
    border-color: #c7d2fe;
  }
  .btn-json:hover {
    background: #e0e7ff;
    border-color: #a5b4fc;
  }
</style>
</head>
<body>
<div class="container">
  <h1>فهرست قوانین دامنه نوسان</h1>
  <div class="sub">درصدها را با فلش‌های بالا/پایین (یا تایپ عدد) تغییر دهید. تغییرات به صورت خودکار در بانک مرورگر ذخیره می‌شود.</div>

  <table>
    <thead>
      <tr>
        <th>دسته</th>
        <th style="width: 100px;">درصد</th>
        <th>توضیح</th>
      </tr>
    </thead>
    <tbody id="rulesBody">
      <!-- ردیف‌ها توسط جاوااسکریپت ساخته می‌شوند -->
    </tbody>
  </table>

  <div class="actions">
    <button class="btn btn-reset" onclick="resetDefaults()">↺ بازگرداندن به پیش‌فرض</button>
    <button class="btn btn-json" onclick="downloadJSON()">⬇️ دریافت فایل JSON</button>
  </div>
</div>

<script>
// داده‌های پیش‌فرض
const defaultRules = [
  { cat: "سهام بازار اصلی (تابلوی اصلی و فرعی)", pct: 6, desc: "سهام در تابلوهای اصلی و فرعی بورس و فرابورس" },
  { cat: "حق تقدم بازار اصلی (تابلوی اصلی و فرعی)", pct: 6, desc: "حق تقدم در تابلوهای اصلی و فرعی" },
  { cat: "سهام بازار سرمایه‌گذاری حرفه‌ای", pct: 3, desc: "سهام در بازار سرمایه‌گذاری حرفه‌ای" },
  { cat: "حق تقدم بازار سرمایه‌گذاری حرفه‌ای", pct: 3, desc: "حق تقدم در بازار سرمایه‌گذاری حرفه‌ای" },
  { cat: "بازار پایه - تابلوی زرد (الف)", pct: 3, desc: "بازار پایه فرابورس، تابلوی زرد" },
  { cat: "بازار پایه - تابلوی نارنجی (ب)", pct: 2, desc: "بازار پایه فرابورس، تابلوی نارنجی" },
  { cat: "بازار پایه - تابلوی قرمز (ج)", pct: 1, desc: "بازار پایه فرابورس، تابلوی قرمز" },
  { cat: "صندوق سهامی و مختلط", pct: 10, desc: "صندوق‌های سرمایه‌گذاری سهامی و مختلط" },
  { cat: "صندوق اهرمی", pct: 6, desc: "صندوق‌های سرمایه‌گذاری اهرمی (اهرم، توان، داریوش و...)" },
  { cat: "صندوق طلا (و نقره)", pct: 10, desc: "صندوق‌های سرمایه‌گذاری مبتنی بر طلا و نقره" },
  { cat: "صندوق کالایی (سایر)", pct: 10, desc: "صندوق‌های کالایی غیر از طلا (زعفران، زیره و...)" },
  { cat: "صندوق درآمد ثابت", pct: 1, desc: "صندوق‌های سرمایه‌گذاری در اوراق با درآمد ثابت" },
  { cat: "اوراق بدهی (اختیار معامله، اختیار فروش تبعی و ...)", pct: 5, desc: "اوراق بدهی، اختیار معامله و اختیار فروش تبعی" },
  { cat: "اوراق تسهیلات مسکن", pct: 5, desc: "اوراق تسه (تسهیلات مسکن)" },
  { cat: "قرارداد آتی (شمش طلا، نقره، مس)", pct: 10, desc: "قراردادهای آتی فلزات گرانبها در بورس کالا" },
  { cat: "قرارداد آتی (سایر کالاها)", pct: 5, desc: "قراردادهای آتی سایر کالاها (زعفران، زیره و...)" },
  { cat: "گواهی سپرده کالایی (شمش و سکه)", pct: 5, desc: "گواهی سپردهٔ شمش و سکه در بورس کالا" }
];

let currentRules = [];

// بارگذاری از حافظه مرورگر
function loadData() {
  const saved = localStorage.getItem('tse_range_rules_v2');
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (parsed.length === defaultRules.length) {
        currentRules = parsed;
      } else {
        currentRules = JSON.parse(JSON.stringify(defaultRules));
      }
    } catch (e) {
      currentRules = JSON.parse(JSON.stringify(defaultRules));
    }
  } else {
    currentRules = JSON.parse(JSON.stringify(defaultRules));
  }
}

// ذخیره در حافظه مرورگر
function saveData() {
  localStorage.setItem('tse_range_rules_v2', JSON.stringify(currentRules));
  showToast();
}

// رسم جدول
function renderTable() {
  const tbody = document.getElementById('rulesBody');
  tbody.innerHTML = '';
  
  currentRules.forEach((rule, index) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${rule.cat}</td>
      <td>
        <div class="pct-wrapper">
          <span>±</span>
          <input type="number" step="1" min="0" max="50" class="pct-input" data-index="${index}" value="${rule.pct}">
          <span>٪</span>
        </div>
      </td>
      <td class="desc">${rule.desc}</td>
    `;
    tbody.appendChild(tr);
  });

  // شنونده برای تغییر مقادیر
  document.querySelectorAll('.pct-input').forEach(input => {
    input.addEventListener('input', (e) => {
      const idx = parseInt(e.target.dataset.index);
      let val = parseFloat(e.target.value);
      if (!isNaN(val) && val >= 0) {
         currentRules[idx].pct = val;
         saveData();
      }
    });
    
    input.addEventListener('change', (e) => {
       if (e.target.value === '') {
         e.target.value = 0;
         currentRules[parseInt(e.target.dataset.index)].pct = 0;
         saveData();
       }
    });
  });
}

// نمایش پیام ذخیره
let toastTimeout;
function showToast() {
  let toast = document.getElementById('toast');
  if(!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.style.cssText = 'position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:#10b981; color:#fff; padding:10px 24px; border-radius:30px; font-size:13px; font-weight:bold; opacity:0; transition:all 0.3s; z-index:1000; pointer-events:none; box-shadow: 0 4px 12px rgba(16,185,129,0.4);';
    document.body.appendChild(toast);
  }
  toast.textContent = '✓ تغییرات در بانک ذخیره شد';
  toast.style.opacity = '1';
  toast.style.transform = 'translateX(-50%) translateY(0)';
  
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => { 
    toast.style.opacity = '0'; 
    toast.style.transform = 'translateX(-50%) translateY(20px)';
  }, 2000);
}

// بازگرداندن به حالت اول
function resetDefaults() {
  if (confirm('آیا از بازگرداندن تمام مقادیر به حالت پیش‌فرض مطمئن هستید؟')) {
    currentRules = JSON.parse(JSON.stringify(defaultRules));
    saveData();
    renderTable();
  }
}

// دانلود فایل JSON برای استفاده در پایتون
function downloadJSON() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentRules, null, 2));
  const a = document.createElement('a');
  a.setAttribute("href", dataStr);
  a.setAttribute("download", "tse_range_rules.json");
  document.body.appendChild(a);
  a.click();
  a.remove();
}

// شروع
document.addEventListener('DOMContentLoaded', () => {
  loadData();
  renderTable();
});
</script>
</body>
</html>
